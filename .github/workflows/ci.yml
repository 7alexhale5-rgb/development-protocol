name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and package tests
        run: python3 -m unittest discover tests -v
      - name: Private-data scan
        run: bash tests/sanitization.sh
      - name: Install into a clean home and health-check
        run: |
          export HOME="$(mktemp -d)"
          ./install.sh --yes --target both
          ./health-check.sh --target both
          ./uninstall.sh --yes
  version:
    # A change users receive must carry a new plugin version, or synced installs never update.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Version bumped when skills or manifests change
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check_version_bump.py --base "origin/$BASE_REF"
